name: stonehenge-middleware

include:
  - path: ./stonehenge-middleware/docker-compose.yml

services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: stonehenge-caddy
    restart: unless-stopped
    environment:
      ENGINEERING_HOSTNAME: ${ENGINEERING_HOSTNAME:-engineering.fcu.gov}
      API_HOSTNAME: ${STONEHENGE_API_HOSTNAME:-api.fcu.gov}
      ACME_CA_DIRECTORY: ${STONEHENGE_ACME_CA_DIRECTORY:-https://ca.fcu.gov:8443/acme/acme/directory}
      TARGET_FEED_AUTH_TOKEN: ${STONEHENGE_INGEST_TOKEN:-}
    ports:
      - "${STONEHENGE_EDGE_HOST_IP:-0.0.0.0}:80:80"
      - "${STONEHENGE_EDGE_HOST_IP:-0.0.0.0}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./stonehenge-engineering-app/certificates/fcu-lab-root-ca.crt:/etc/caddy/pki/fcu-lab-root-ca.crt:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      engineering-app:
        condition: service_started
      stonehenge-api:
        condition: service_healthy
    networks:
      stonehenge-control:
        ipv4_address: 172.28.0.5

  stonehenge-api:
    build:
      context: ./stonehenge-api
    image: stonehenge-api:latest
    container_name: stonehenge-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${STONEHENGE_API_ENVIRONMENT:-Development}
      Swagger__Enabled: ${STONEHENGE_API_SWAGGER_ENABLED:-false}
      Stonehenge__MiddlewareBaseUrl: ${STONEHENGE_MIDDLEWARE_URL:-http://middleware:8080}
      Stonehenge__UseLiveMiddlewareAstroData: ${STONEHENGE_API_USE_LIVE_ASTRO_DATA:-true}
      Stonehenge__AllowSeededAstroFallback: ${STONEHENGE_API_ALLOW_SEEDED_ASTRO_FALLBACK:-false}
      ApiKeyAuth__Pepper: ${STONEHENGE_API_KEY_PEPPER:-development-only-change-me}
      ApiKeyAuth__AllowLegacyDevKeys: ${STONEHENGE_API_ALLOW_LEGACY_DEV_KEYS:-true}
      TrainingVulnerabilities__Enabled: ${STONEHENGE_TRAINING_VULNS_ENABLED:-false}
      Operational__MaintenanceShotThreshold: ${STONEHENGE_MAINTENANCE_SHOT_THRESHOLD:-200}
    ports:
      - "${STONEHENGE_API_HOST_IP:-127.0.0.1}:${STONEHENGE_API_PORT:-8092}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/system/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      middleware:
        condition: service_started
    networks:
      - stonehenge-control

  engineering-app:
    build:
      context: ./stonehenge-engineering-app
    image: stonehenge-engineering-app:latest
    container_name: stonehenge-engineering-app
    restart: unless-stopped
    env_file:
      - path: ./stonehenge-middleware/.env
        required: false
      - path: ./stonehenge-api/.generated/stonehenge-api-keys.env
        required: false
    environment:
      Authentication__Mode: ${STONEHENGE_AUTH_MODE:-Dev}
      TrainingVulnerabilities__Enabled: ${STONEHENGE_TRAINING_VULNS_ENABLED:-false}
      Operational__MaintenanceShotThreshold: ${STONEHENGE_MAINTENANCE_SHOT_THRESHOLD:-200}
      Authentication__DataProtectionKeysPath: /data/data-protection-keys
      Authentication__Oidc__Authority: ${STONEHENGE_OIDC_AUTHORITY:-}
      Authentication__Oidc__ClientId: ${STONEHENGE_OIDC_CLIENT_ID:-}
      Authentication__Oidc__ClientSecret: ${STONEHENGE_OIDC_CLIENT_SECRET:-}
      Authentication__Oidc__CallbackPath: ${STONEHENGE_OIDC_CALLBACK_PATH:-/signin-oidc}
      Authentication__Oidc__SignedOutCallbackPath: ${STONEHENGE_OIDC_SIGNED_OUT_CALLBACK_PATH:-/signout-callback-oidc}
      Authentication__Oidc__RequireHttpsMetadata: ${STONEHENGE_OIDC_REQUIRE_HTTPS_METADATA:-true}
      Authentication__Oidc__EngineeringBoundary__ClaimTypes__0: ${STONEHENGE_ENGINEERING_CLAIM_TYPE:-groups}
      Authentication__Oidc__EngineeringBoundary__Values__0: ${STONEHENGE_ENGINEERING_CLAIM_VALUE:-SCA-Engineering-Users}
      Authentication__Oidc__EngineeringBoundary__Values__1: ${STONEHENGE_ENGINEERING_ADMIN_CLAIM_VALUE:-SCA-Engineering-Admins}
      Authentication__Oidc__AdminBoundary__ClaimTypes__0: ${STONEHENGE_ADMIN_CLAIM_TYPE:-groups}
      Authentication__Oidc__AdminBoundary__Values__0: ${STONEHENGE_ADMIN_CLAIM_VALUE:-SCA-Engineering-Admins}
      Authentication__ForwardedHeaders__KnownProxies__0: ${STONEHENGE_TRUSTED_PROXY_IP:-172.28.0.5}
      Authentication__ForwardedHeaders__KnownNetworks__0: ${STONEHENGE_TRUSTED_PROXY_NETWORK:-}
      STONEHENGE_MIDDLEWARE_URL: ${STONEHENGE_MIDDLEWARE_URL:-http://middleware:8080}
      STONEHENGE_CONTROL_TOKEN: ${STONEHENGE_CONTROL_TOKEN:-}
      STONEHENGE_FUXA_PROXY_TOKEN: ${STONEHENGE_FUXA_PROXY_TOKEN:-}
      STONEHENGE_APP_DB_PATH: /data/stonehenge-engineering.db
      STONEHENGE_SHOW_DEV_AUTH: ${STONEHENGE_SHOW_DEV_AUTH:-true}
      Fuxa__Enabled: ${FUXA_EMBED_ENABLED:-true}
      Fuxa__BaseUrl: ${FUXA_BASE_URL:-}
      Fuxa__InternalBaseUrl: ${FUXA_INTERNAL_BASE_URL:-http://fuxa:1881}
      Fuxa__EmbedPathTemplate: ${FUXA_EMBED_PATH_TEMPLATE:-/stonehenge/embed/{fuxaViewId}}
      Fuxa__LocalProxyPathTemplate: ${FUXA_LOCAL_PROXY_PATH_TEMPLATE:-/fuxa/embed/{fuxaViewId}}
      Fuxa__DefaultPanelHeight: ${FUXA_DEFAULT_PANEL_HEIGHT:-720}
      Fuxa__AllowDirectExternalFuxaLinks: "false"
      StonehengeApi__Enabled: ${STONEHENGE_API_SYNC_ENABLED:-true}
      StonehengeApi__BaseUrl: ${STONEHENGE_API_BASE_URL:-http://stonehenge-api:8080/api/v1}
    ports:
      - "${ENGINEERING_APP_HOST_IP:-127.0.0.1}:${ENGINEERING_APP_PORT:-8088}:8080"
    volumes:
      - engineering-app-data:/data
    depends_on:
      middleware:
        condition: service_started
      stonehenge-api:
        condition: service_healthy
      fuxa:
        condition: service_healthy
    networks:
      - stonehenge-control

  stonehenge-target-feed:
    build:
      context: ./stonehenge-targets
    image: stonehenge-target-feed:latest
    restart: unless-stopped
    env_file:
      - path: ./stonehenge-targets/.env
        required: false
    environment:
      TARGET_ENDPOINT: ${TARGET_ENDPOINT:-http://middleware:8080/api/v1/ingest/fragments}
      TARGET_AUTH_TOKEN: ${STONEHENGE_INGEST_TOKEN:-}
      TARGET_MODE: ${TARGET_MODE:-continuous}
      TARGET_READINESS_POLL_SECONDS: ${TARGET_READINESS_POLL_SECONDS:-30}
      TARGET_STARTUP_STABILIZATION_SECONDS: ${TARGET_STARTUP_STABILIZATION_SECONDS:-30}
      FEED_LISTEN_ADDRESS: ${FEED_LISTEN_ADDRESS:-0.0.0.0:8090}
    ports:
      - "${TARGET_FEED_HOST_IP:-127.0.0.1}:${TARGET_FEED_PORT:-8090}:8090"
    depends_on:
      middleware:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - stonehenge-control

  playwright:
    profiles:
      - tools
    build:
      context: ./stonehenge-engineering-app/tools/playwright
    image: stonehenge-engineering-playwright:latest
    working_dir: /work
    environment:
      BASE_URL: http://engineering-app:8080
      API_BASE_URL: http://stonehenge-api:8080/api/v1
      TRAINING_PROFILE: ${TRAINING_PROFILE:-safe}
      MAINTENANCE_SHOT_THRESHOLD: ${STONEHENGE_MAINTENANCE_SHOT_THRESHOLD:-200}
    volumes:
      - ./stonehenge-engineering-app/tools/playwright:/work
      - ./stonehenge-engineering-app/Controllers:/work/Controllers:ro
      - ./stonehenge-engineering-app/Security:/work/Security:ro
      - playwright-node-modules:/work/node_modules
    depends_on:
      - engineering-app
    networks:
      - stonehenge-control

volumes:
  caddy-data:
  caddy-config:
  engineering-app-data:
  playwright-node-modules:
