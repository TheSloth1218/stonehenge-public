    networks:
      stonehenge-control:
        ipv4_address: 172.28.0.18

  fuxa:
    build:
      context: .
      dockerfile: docker/fuxa/Dockerfile
    image: stonehenge-fuxa:1.3.3-plugins
    restart: unless-stopped
    depends_on:
      - openplc-control-gun1
    ports:
      - "${FUXA_HOST_IP:-127.0.0.1}:${FUXA_PORT:-1881}:1881"
    environment:
      STONEHENGE_CONTROL_TOKEN: ${STONEHENGE_CONTROL_TOKEN:-}
      STONEHENGE_FUXA_PROXY_TOKEN: ${STONEHENGE_FUXA_PROXY_TOKEN:-}
    volumes:
      - fuxa_appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa_db:/usr/src/app/FUXA/server/_db
      - fuxa_logs:/usr/src/app/FUXA/server/_logs
      - fuxa_images:/usr/src/app/FUXA/server/_images
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:1881',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      stonehenge-control:
        ipv4_address: 172.28.0.20

volumes:
  postgres-data:
  openplc-runtime-data:
  openplc-safety-runtime-data:
  openplc-gun2-runtime-data:
  openplc-gun3-runtime-data:
  openplc-gun4-runtime-data:
  openplc-gun5-runtime-data:
  openplc-gun6-runtime-data:
  openplc-gun7-runtime-data:
  openplc-gun8-runtime-data:
  fuxa_appdata:
  fuxa_db:
  fuxa_logs:
  fuxa_images:

networks:
  stonehenge-control:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
