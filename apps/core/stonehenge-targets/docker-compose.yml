services:
  stonehenge-target-feed:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
