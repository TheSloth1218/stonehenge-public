server {
    listen 80;
    listen [::]:80;
    server_name vendor.fcu.gov;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stonehenge-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://vendor.fcu.gov$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vendor.fcu.gov;

    ssl_certificate /etc/letsencrypt/live/vendor.fcu.gov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vendor.fcu.gov/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:STONEHENGE_VENDOR_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Keep the proxy transparent to the application. The isolated training
    # profile relies on authenticated POST bodies and training-only routes
    # reaching Spring unchanged; do not add auth_request, path denylists,
    # method restrictions, or body transformations here.
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_set_header Host vendor.fcu.gov;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host vendor.fcu.gov;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
