spring:
  application:
    name: sca-parts-fulfillment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stonehenge_vendor}
    username: ${SPRING_DATASOURCE_USERNAME:stonehenge_vendor}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local-dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  security:
    oauth2:
      client:
        registration:
          dex:
            provider: dex
            client-id: ${OIDC_CLIENT_ID:stonehenge-vendor}
            client-secret: ${OIDC_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: ${OIDC_SCOPES:openid,profile,email,groups}
        provider:
          dex:
            issuer-uri: ${OIDC_ISSUER:https://login.fcu.gov/dex}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8089}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: STONEHENGE_VENDOR_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: SCA Parts Fulfillment Portal
    version: 0.1.0
    service-account: stonevendor

stonehenge:
  api:
    base-url: ${STONEHENGE_API_BASE_URL:https://api.fcu.gov/api/v1}
    api-key: ${STONEHENGE_VENDOR_API_KEY:vendor-dev-key}
    connect-timeout: ${STONEHENGE_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${STONEHENGE_API_READ_TIMEOUT:5s}
    polling-enabled: ${STONEHENGE_API_POLLING_ENABLED:true}
    polling-attempts: ${STONEHENGE_API_POLLING_ATTEMPTS:3}
    poll-interval-ms: ${STONEHENGE_API_POLL_INTERVAL_MS:30000}

app:
  dev-user: ${SCA_DEV_USER:operator}
  public-origin: ${APP_PUBLIC_ORIGIN:https://vendor.fcu.gov}
  auth-session-secret: ${AUTH_SESSION_SECRET:}

sca:
  security:
    employee-group: ${SCA_EMPLOYEE_GROUP:SCA-Employees}
    admin-group: ${SCA_ADMIN_GROUP:SCA-Admins}
  training:
    enabled: false
  shipment:
    compatibility:
      enabled: true
      format: strict-json
      export-route: /admin/shipment-jobs/{id}/export
      replay-route: /admin/shipment-jobs/replay
    worker:
      enabled: true
      interval: 5000
      max-attempts: 3
    work-directory: /var/lib/stonehenge-vendor/shipment-jobs
  internal-api:
    base-url: ${STONEHENGE_API_BASE_URL:https://api.fcu.gov/api/v1}
    key-environment: STONEHENGE_VENDOR_API_KEY
  runtime:
    service-account: stonevendor
