<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common/head :: head('Health and Connectivity')}"></head>
<body><div th:replace="~{common/nav :: nav}"></div><main class="container-fluid"><h1 class="h4">Health and Connectivity</h1><table class="table"><tbody>
<tr><th>Application</th><td>Running</td></tr><tr><th>Database</th><td th:text="${databaseUp ? 'Connected' : 'Unavailable'}"></td></tr><tr><th>Stonehenge API</th><td th:text="${apiConfigured ? 'Configured' : 'Unconfigured'}"></td></tr><tr><th>API host</th><td th:text="${apiHost}"></td></tr><tr><th>Shipment worker</th><td th:text="${workerEnabled ? 'Enabled' : 'Disabled'}"></td></tr><tr><th>Active profiles</th><td th:text="${profiles}"></td></tr><tr><th>Last successful sync</th><td th:text="${lastSuccess != null ? #temporals.format(lastSuccess.attemptedAt, 'yyyy-MM-dd HH:mm') : 'None'}"></td></tr><tr><th>Last failed sync</th><td th:text="${lastFailure != null ? #temporals.format(lastFailure.attemptedAt, 'yyyy-MM-dd HH:mm') : 'None'}"></td></tr>
</tbody></table></main></body></html>
