<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common/head :: head('Inventory Adjustment History')}"></head>
<body><div th:replace="~{common/nav :: nav}"></div><main class="container-fluid"><h1 class="h4">Inventory Adjustment History</h1>
<form class="row g-2 mb-3" method="get"><div class="col-md-3"><select class="form-select" name="partId"><option value="">All parts</option><option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.sku + ' - ' + p.name}" th:selected="${p.id == partId}"></option></select></div><div class="col-md-2"><select class="form-select" name="employeeId"><option value="">All employees</option><option th:each="u : ${users}" th:value="${u.id}" th:text="${u.displayName}" th:selected="${u.id == employeeId}"></option></select></div><div class="col-md-2"><select class="form-select" name="type"><option value="">All types</option><option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option></select></div><div class="col-md-2"><input class="form-control" type="date" name="from" th:value="${from}"></div><div class="col-md-2"><input class="form-control" type="date" name="to" th:value="${to}"></div><div class="col-md-1"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
<table class="table table-hover"><thead><tr><th>Part</th><th>Type</th><th>Delta</th><th>Prior</th><th>Result</th><th>Employee</th><th>Reason</th><th>Time</th></tr></thead><tbody>
<tr th:each="a : ${adjustments.content}"><td th:text="${a.inventory.part.sku}"></td><td th:text="${a.adjustmentType}"></td><td th:text="${a.quantityDelta}"></td><td th:text="${a.previousQuantity}"></td><td th:text="${a.resultingQuantity}"></td><td th:text="${a.createdByUser != null ? a.createdByUser.displayName : 'System'}"></td><td th:text="${a.reason}"></td><td th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm')}"></td></tr>
</tbody></table></main></body></html>
