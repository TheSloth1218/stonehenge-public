<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('Catalog Part')}"></head>
<body><div th:replace="~{common/nav :: nav}"></div><main class="container-fluid"><div class="panel">
<h1 class="h4" th:text="${part == null ? 'Create Catalog Part' : 'Edit Catalog Part'}"></h1>
<p th:if="${part != null}" class="text-muted"><span th:text="${historicalReferences}"></span> historical order references. Records are deactivated instead of deleted.</p>
<form method="post" th:action="${part == null ? '/admin/parts' : '/admin/parts/' + part.id}" th:object="${partForm}">
<div class="row g-2"><div class="col-md-4"><label class="form-label">SKU</label><input class="form-control" th:field="*{sku}"></div><div class="col-md-8"><label class="form-label">Name</label><input class="form-control" th:field="*{name}"></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div>
<div class="col-md-4"><label class="form-label">Category</label><input class="form-control" th:field="*{category}"></div><div class="col-md-4"><label class="form-label">Manufacturer</label><input class="form-control" th:field="*{manufacturer}"></div><div class="col-md-4"><label class="form-label">Compatible asset class</label><input class="form-control" th:field="*{compatibleAssetClass}"></div>
<div class="col-md-8"><label class="form-label">Image path</label><input class="form-control" th:field="*{imagePath}"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Active</label></div></div></div>
<div class="mt-3"><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="/admin/parts">Cancel</a></div></form>
</div></main></body></html>
