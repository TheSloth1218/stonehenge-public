<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common/head :: head('Sync Diagnostic')}"></head>
<body><div th:replace="~{common/nav :: nav}"></div><main class="container-fluid"><div class="panel"><h1 class="h4">Synchronization Diagnostic</h1><dl class="row">
<dt class="col-sm-3">API host</dt><dd class="col-sm-9" th:text="${apiHost}"></dd><dt class="col-sm-3">Endpoint</dt><dd class="col-sm-9" th:text="${'/vendor/part-requests/' + sync.maintenanceRequest.externalRequestId + '/complete'}"></dd><dt class="col-sm-3">Method</dt><dd class="col-sm-9">POST</dd><dt class="col-sm-3">External request</dt><dd class="col-sm-9" th:text="${sync.maintenanceRequest.externalRequestId}"></dd><dt class="col-sm-3">Order</dt><dd class="col-sm-9" th:text="${sync.fulfillmentOrder.orderNumber}"></dd><dt class="col-sm-3">Correlation</dt><dd class="col-sm-9" th:text="${sync.correlationId}"></dd><dt class="col-sm-3">Service account</dt><dd class="col-sm-9" th:text="${serviceAccount}"></dd><dt class="col-sm-3">API key source</dt><dd class="col-sm-9" th:text="${apiKeyEnvironment}"></dd><dt class="col-sm-3">Result</dt><dd class="col-sm-9" th:text="${sync.sanitizedMessage}"></dd></dl>
<form th:if="${!sync.success}" method="post" th:action="@{/admin/sync/{id}/retry(id=${sync.id})}"><button class="btn btn-primary">Retry completion</button></form></div></main></body></html>
