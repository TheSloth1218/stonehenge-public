<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common/head :: head('Synchronization History')}"></head>
<body><div th:replace="~{common/nav :: nav}"></div><main class="container-fluid"><h1 class="h4">Full Synchronization History</h1><form class="d-flex gap-2 mb-3" method="get"><select class="form-select" name="success" style="max-width:14rem"><option value="">All results</option><option value="true" th:selected="${success == true}">Succeeded</option><option value="false" th:selected="${success == false}">Failed</option></select><button class="btn btn-outline-primary">Filter</button></form><table class="table table-hover"><thead><tr><th>ID</th><th>Operation</th><th>Request</th><th>Result</th><th>Status</th><th>Correlation</th><th>Attempted</th><th></th></tr></thead><tbody>
<tr th:each="s : ${syncEvents.content}"><td th:text="${s.id}"></td><td th:text="${s.operation}"></td><td th:text="${s.maintenanceRequest != null ? s.maintenanceRequest.externalRequestId : '-'}"></td><td th:text="${s.success ? 'Succeeded' : 'Failed'}"></td><td th:text="${s.httpStatus ?: '-'}"></td><td th:text="${s.correlationId}"></td><td th:text="${#temporals.format(s.attemptedAt, 'yyyy-MM-dd HH:mm')}"></td><td><a th:href="@{/admin/sync/{id}(id=${s.id})}">Detail</a></td></tr>
</tbody></table></main></body></html>
