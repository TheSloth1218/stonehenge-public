<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(${title})}"></head>
<body><div th:replace="~{common/nav :: nav}"></div>
<main class="container">
    <div class="panel">
        <h1 class="h4" th:text="${title}"></h1>
        <p th:text="${message}"></p>
        <p class="text-muted">Reference: <span th:text="${reference}"></span></p>
        <a class="btn btn-outline-primary" href="/">Return to dashboard</a>
    </div>
</main></body></html>
